name: macOS scaffold

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Record exact toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers
      - name: Verify generated project
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- FlowState.xcodeproj
      - name: Format, test packages, and build sandboxed app
        run: bash scripts/check.sh
      - name: Build UI test harness
        run: >-
          xcodebuild -project FlowState.xcodeproj -scheme FlowState
          -destination 'platform=macOS' -derivedDataPath .build/xcode build-for-testing

